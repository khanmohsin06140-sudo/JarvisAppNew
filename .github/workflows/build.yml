name: Auto Unzip Code

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip the file
        run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "Unzipping $ZIP_FILE..."
          unzip "$ZIP_FILE" -d extracted_code
          
          PROJECT_DIR=$(dirname $(find extracted_code -name package.json | head -n 1))
          echo "Moving files..."
          cp -a "$PROJECT_DIR"/. ./
          
          rm -rf extracted_code
          rm "$ZIP_FILE"

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Unzipped website code automatically" || echo "Nothing to commit"
          git push
