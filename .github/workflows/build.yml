name: Auto Unzip Website Code

on:
  push:
    paths:
      - 'GurudevCollection_Code.zip'
  workflow_dispatch:

jobs:
  extract-and-setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip the Code automatically
        run: |
          echo "Unzipping the file..."
          unzip GurudevCollection_Code.zip -d extracted_code
          
          echo "Finding the React project inside the zip..."
          # Find the directory that has package.json
          PROJECT_DIR=$(dirname $(find extracted_code -name package.json | head -n 1))
          
          echo "Moving files to the main repository..."
          cp -r $PROJECT_DIR/* ./
          
          echo "Cleaning up ZIP and temporary folders..."
          rm -rf extracted_code
          rm GurudevCollection_Code.zip

      - name: Commit and Push extracted files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Automated Action: Unzipped Gurudev Collection Code" || echo "No changes to commit"
          git push
